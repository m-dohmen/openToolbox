name: Bug report
description: Something does not work in the built file
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: opened
    attributes:
      label: How was the file opened?
      options:
        - Double-click (file://)
        - Served over HTTP
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size of the built file
      placeholder: 91 KB
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
