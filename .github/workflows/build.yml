name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build is really one self-contained file
        run: |
          test -f dist/index.html
          size=$(stat -c%s dist/index.html)
          echo "dist/index.html is $size bytes"
          if [ "$size" -lt 40000 ]; then
            echo "Build far too small — the script was probably not inlined."
            exit 1
          fi
          if grep -qE '<script[^>]+src=|<link[^>]+href="http' dist/index.html; then
            echo "External reference found in the built file."
            exit 1
          fi
      - name: Check the agent instructions and the skill are intact
        run: |
          # CLAUDE.md is a copy of AGENTS.md; a change to one without the other
          # silently gives Claude Code stale instructions.
          if ! diff -q AGENTS.md CLAUDE.md; then
            echo "CLAUDE.md differs from AGENTS.md — run 'cp AGENTS.md CLAUDE.md' and commit."
            exit 1
          fi
          node -e '
            const fs = require("node:fs")
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"))
            const plugin = JSON.parse(fs.readFileSync("plugin/.claude-plugin/plugin.json", "utf8"))
            const skill = fs.readFileSync("plugin/skills/opentoolbox-tool/SKILL.md", "utf8")
            const fail = (m) => { console.error(m); process.exit(1) }
            if (!market.name || !market.owner || !Array.isArray(market.plugins)) fail("marketplace.json: name, owner and plugins are required.")
            for (const p of market.plugins) {
              if (!p.name || !p.source) fail("marketplace.json: every plugin needs name and source.")
              if (typeof p.source === "string" && !fs.existsSync(p.source)) fail(`marketplace.json: source ${p.source} does not exist.`)
            }
            if (!plugin.name) fail("plugin.json: name is required.")
            const front = skill.match(/^---\n([\s\S]*?)\n---/)
            if (!front) fail("SKILL.md: no YAML frontmatter.")
            for (const key of ["name", "description"]) {
              if (!new RegExp(`^${key}:`, "m").test(front[1])) fail(`SKILL.md: frontmatter is missing ${key}.`)
            }
            console.log("Plugin manifests and skill frontmatter look sound.")
          '

      - run: npm run build:demo
      - name: Check the committed demos are current
        run: |
          if ! git diff --quiet -- docs/demo docs/demos; then
            echo "The built demos are out of date — run 'npm run build:demo' and commit the result."
            git --no-pager diff --stat -- docs/demo docs/demos
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: opentoolbox-single-file
          path: dist/index.html
