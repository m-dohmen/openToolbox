# Publishes the built single file as a live demo on GitHub Pages.
# Enable Pages once under Settings → Pages → Source: GitHub Actions.
#
# Two jobs on purpose: the deploy runs only after the same commit has built
# cleanly (needs: build), so a red main is never published. Before this gate
# existed, Pages published independently of the build workflow.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Alle Schaudemos, frisch gebaut, damit die veroeffentlichte Fassung nie
      # hinter dem eingecheckten Stand zurueckfaellt.
      - run: npm run build:demo
      - name: Check everything shipped is self-contained
        run: node scripts/check-self-contained.mjs dist/index.html docs/demo docs/demos
      - name: Check the committed demos are current
        run: |
          if ! git diff --quiet -- docs/demo docs/demos; then
            echo "The built demos are out of date — run 'npm run build:demo' and commit the result."
            git --no-pager diff --stat -- docs/demo docs/demos
            exit 1
          fi
      # Der Artifact-Inhalt ist das, was veroeffentlicht wird — nicht der Repo-
      # Stand. Fehlt hier eine Datei, geht die Seite still demos-frei online;
      # genau deshalb pruefen wir den kopierten Bestand hart (OPEN-89).
      - name: Copy the demos into the site
        run: |
          cp -r docs/demos dist/demos
          # /demo/ ist der alte Einzelpfad. Bestehende Verweise in READMEs,
          # Wiki und aelteren Releases zeigen dorthin und sollen nicht ins
          # Leere laufen.
          cp -r docs/demo dist/demo
          # Die Uebersichtsseite bindet ../logo.svg ein, also /logo.svg.
          cp docs/logo.svg dist/logo.svg
          test -f dist/demos/index.html || { echo 'dist/demos/index.html is missing from the site artifact'; exit 1; }
          test -f dist/demos/ppwr-packaging/index.html || { echo 'dist/demos/ppwr-packaging/index.html is missing from the site artifact'; exit 1; }
          test -f dist/demo/index.html || { echo 'dist/demo/index.html is missing from the site artifact'; exit 1; }
          test -f dist/logo.svg || { echo 'dist/logo.svg is missing from the site artifact'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    needs: build
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
