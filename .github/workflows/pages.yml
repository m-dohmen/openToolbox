# Publishes the built single file as a live demo on GitHub Pages.
# Enable Pages once under Settings → Pages → Source: GitHub Actions.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Die Schaudemo aus examples/portfolio.domain.js liegt unter /demo/ -
      # frisch gebaut, damit die veroeffentlichte Fassung nie hinter dem
      # eingecheckten Stand zurueckfaellt.
      - run: npm run build:demo
      - run: cp -r docs/demo dist/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
