    <!--
      Applies the colour scheme before anything renders. Without it a file saved
      in dark mode flashes the light interface on open. Settings sit in the
      payload deliberately unencrypted.
    -->
    <script>
      (function () {
        var theme = 'system'
        try {
          var p = JSON.parse(document.getElementById('sb-payload').textContent)
          if (p && p.settings && p.settings.theme) theme = p.settings.theme
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()

  as removable chips above the table

  grouping milestones into overdue, this week and the next 30 days, and metric tiles — running
  projects, spend, averages — computed from the data rather than typed
- **Guided entry** — a short wizard that creates an engagement and its first milestone in one run
